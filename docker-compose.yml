version: '3.9'

services:
  db:
    image: mysql:8.0
    command: mysqld --default-authentication-plugin=mysql_native_password
    container_name: shockwave-mysql
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shockwave}
      MYSQL_ROOT_HOST: '%'
      MYSQL_TCP_PORT: ${MYSQL_PORT:-3308}
    ports:
      - "${MYSQL_PORT:-3308}:3308"
    expose:
      - "${MYSQL_PORT:-3308}"
    volumes:
      - shockwave_mysql_data:/var/lib/mysql
    networks:
      - shockwave-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  shockwave:
    image: ghcr.io/gastawny/shockwave/shockwave:${IMAGE_TAG:-master}
    pull_policy: always
    container_name: shockwave-app
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:${MYSQL_PORT:-3308}/${MYSQL_DATABASE:-shockwave}?useTimezone=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shockwave-network

networks:
  shockwave-network:
    name: shockwave-network

volumes:
  shockwave_mysql_data:
    name: shockwave_mysql_data