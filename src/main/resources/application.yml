server:
  port: ${PORT:80}
#cors:
#  originPatterns: http://localhost:3000,http://localhost:8080
security:
  jwt:
    token:
      secret-key: {SECRET_KEY:ds1fg6G4}
      expire-length: 7200000
spring:
  servlet:
    multipart:
      # Max size per uploaded file. Use -1 for unlimited (not recommended).
      max-file-size: 50MB
      # Max total size for multipart/form-data requests.
      max-request-size: 50MB
      # Threshold in memory before writing to disk.
      file-size-threshold: 2MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_JDBC:jdbc:mysql://localhost:3308/shockwave}
    username: ${MYSQL_USERNAME:docker}
    password: ${MYSQL_PASSWORD:a8s45d18}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
spring-doc:
  pathsToMatch:
    - /api/**
    - /auth/**
  swagger-ui:
    use-root-path: true
keys:
  google-maps: ${GOOGLE_MAPS_API_KEY:YOUR_GOOGLE_MAPS_API_KEY_HERE}